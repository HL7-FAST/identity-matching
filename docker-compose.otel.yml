# Local observability stack (Grafana LGTM) layered on docker-compose.yml.
# Usage:
#   docker compose -f docker-compose.otel.yml up --build
# Grafana: http://localhost:3000 (anonymous admin)
#
# If another LGTM container already holds 3000/4317/4318, give this one other host ports:
#   LGTM_GRAFANA_PORT=3001 LGTM_OTLP_GRPC_PORT=4327 LGTM_OTLP_HTTP_PORT=4328 docker compose -f docker-compose.otel.yml up --build

include:
  - docker-compose.yml

services:
  hapi-fhir-jpaserver-start:
    environment:
      JAVA_TOOL_OPTIONS: "-javaagent:/app/opentelemetry-javaagent.jar"
      OTEL_SERVICE_NAME: fast-identity-matching
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      # Only the named instrumentations run: the server span and its route, the span attributes set in code, and the logs.
      OTEL_INSTRUMENTATION_COMMON_DEFAULT_ENABLED: "false"
      OTEL_INSTRUMENTATION_TOMCAT_ENABLED: "true"
      OTEL_INSTRUMENTATION_SERVLET_ENABLED: "true"
      OTEL_INSTRUMENTATION_OPENTELEMETRY_API_ENABLED: "true"
      OTEL_INSTRUMENTATION_OPENTELEMETRY_INSTRUMENTATION_API_ENABLED: "true"
      OTEL_INSTRUMENTATION_LOGBACK_APPENDER_ENABLED: "true"
      # Search query strings are dropped from the access log and server spans by default.
      # Lowercase only. A synthetic-data deployment may let them through:
      # TELEMETRY_CAPTURE_QUERY_STRINGS: "true"

      # Grafana Cloud instead of the local stack: replace the endpoint and add the token.
      # OTEL_EXPORTER_OTLP_ENDPOINT: https://otlp-gateway-<region>.grafana.net/otlp
      # OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Basic ${GRAFANA_CLOUD_OTLP_TOKEN:?set GRAFANA_CLOUD_OTLP_TOKEN}"
    depends_on:
      - lgtm

  lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "${LGTM_GRAFANA_PORT:-3000}:3000"
      - "${LGTM_OTLP_GRPC_PORT:-4317}:4317"
      - "${LGTM_OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - ./otel/grafana/dashboards:/otel-lgtm/dashboards:ro
      - ./otel/grafana/provisioning/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards:ro
      - otel-grafana:/data/grafana
      - otel-prometheus:/data/prometheus
      - otel-loki:/data/loki

volumes:
  otel-grafana:
  otel-prometheus:
  otel-loki:
